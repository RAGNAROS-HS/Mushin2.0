server {
    listen      3000;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Static site: nothing here is user-generated and nothing is framed.
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "DENY"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  512;
    gzip_types       text/plain text/css application/javascript image/svg+xml;

    # Container/orchestrator probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # `expires` sets Cache-Control on its own, so no nested add_header is
    # needed here (a nested one would drop the security headers above).
    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
